services:
  api:
    build:
      context: .
      dockerfile: Dockerfile-api
    container_name: agent_api
    ports:
      - "8000:8000"
    env_file:
      - .env

  web_search_mcp:
    build:
      context: .
      dockerfile: Dockerfile-web-search-mcp
    ports:
      - "8080:8080"
    env_file:
      - ./web_search_mcp/.web_search_mcp.env
    container_name: web_search_mcp_server

  google_mcp:
    build:
      context: .
      dockerfile: Dockerfile-google-mcp
    ports:
      - "8081:8081"
    env_file:
      - ./google_mcp/.google_mcp.env
    environment:
      MCP_PORT: "8081"
    container_name: google_mcp_server

  librechat:
    image: ghcr.io/danny-avila/librechat-dev:latest
    restart: unless-stopped
    depends_on:
      - librechat-mongo
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
    ports:
      - "3080:3080"
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml
      - ./librechat/images:/app/client/public/images
      - ./librechat/uploads:/app/uploads
      - ./librechat/logs:/app/api/logs 

  librechat-mongo:
    image: mongo:7
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - librechat-mongo-data:/data/db

volumes:
  librechat-mongo-data:
