name: Trivy

on:
  pull_request:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build genie-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-api
          load: true
          tags: genie-api:pr
          push: false

      - name: Scan genie-api
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: genie-api:pr
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build genie-web-search-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-web-search-mcp
          load: true
          tags: genie-web-search-mcp:pr
          push: false

      - name: Scan genie-web-search-mcp
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: genie-web-search-mcp:pr
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build genie-google-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-google-mcp
          load: true
          tags: genie-google-mcp:pr
          push: false

      - name: Scan genie-google-mcp
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: genie-google-mcp:pr
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
