name: Trivy

on:
  pull_request:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build genie-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-api
          load: true
          tags: genie-api:pr
          push: false

      - name: Scan genie-api
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: genie-api:pr
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Build genie-mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-mcp
          load: true
          tags: genie-mcp:pr
          push: false

      - name: Scan genie-mcp
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: genie-mcp:pr
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true