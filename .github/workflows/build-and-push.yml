name: Build, Scan, Publish, and Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: vedasur

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: genie-api
            dockerfile: Dockerfile-api
          - name: genie-mcp
            dockerfile: Dockerfile-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 1. Scan repository for leaked secrets
      # ---------------------------------------------------------
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 2. Set up Docker
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 3. Log in to GHCR
      # ---------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 4. Generate image metadata
      # ---------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}

      # ---------------------------------------------------------
      # 5. Build image locally
      #
      # load: true makes the image available to Docker locally
      # so Trivy can scan the exact image before publishing it.
      # ---------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: |
            ${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # ---------------------------------------------------------
      # 6. Scan image for vulnerabilities + secrets
      #
      # The workflow FAILS if HIGH or CRITICAL findings exist.
      # ---------------------------------------------------------
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.name }}:${{ github.ref_name }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # ---------------------------------------------------------
      # 7. Tag scanned image for GHCR
      # ---------------------------------------------------------
      - name: Tag image for GHCR
        run: |
          docker tag \
            "${{ matrix.name }}:${{ github.ref_name }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.ref_name }}"

      # ---------------------------------------------------------
      # 8. Push ONLY after the security scan passes
      # ---------------------------------------------------------
      - name: Push image to GHCR
        run: |
          docker push \
            "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.name }}:${{ github.ref_name }}"

  # -----------------------------------------------------------
  #                         GitOps
  # -----------------------------------------------------------
  update-gitops:
    needs: build-scan-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: gitops-genie-prod

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: Vedasur/apps-k3s-config
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops-repo

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags
        working-directory: gitops-repo/manifests/genie/overlays/prod
        run: |
          kustomize edit set image \
            genie-api=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/genie-api:${{ github.ref_name }} \
            genie-mcp=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/genie-mcp:${{ github.ref_name }}
          cat kustomization.yaml

      - name: Commit and push
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add manifests/genie/overlays/prod/kustomization.yaml

          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "genie(prod): bump images to ${{ github.ref_name }}"

          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
