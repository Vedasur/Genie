version: 1.2.1

endpoints:
  custom:
    - name: "genie-agent"
      apiKey: "dummy-key"
      baseURL: "http://api:8000/v1"
      headers:
        X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-User-Id: "{{LIBRECHAT_USER_ID}}"

      models:
        default: ["Genie"]
        fetch: false

      modelDisplayLabel: "Genie"

      iconURL: "https://cdn-icons-png.flaticon.com/128/3408/3408720.png"

      titleConvo: true
      titleTiming: "immediate"
      titleMethod: "completion"
      titleModel: "current_model"
      titlePrompt: "TITLE_REQUEST::{convo}"
      titlePromptTemplate: "{input}"

      customParams:
        reasoningFormat: reasoning_object
        reasoningKey: reasoning_content
        includeReasoningContent: true

    # Test endpoint -> POST /v2/chat/completions (logs the request, returns a stub reply)
    - name: "genie-agent-v2"
      apiKey: "dummy-key"
      baseURL: "http://api:8000/v2"
      headers:
        X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-User-Id: "{{LIBRECHAT_USER_ID}}"

      models:
        default: ["Genie-v2"]
        fetch: false

      modelDisplayLabel: "Genie v2 (test)"

      titleConvo: false

mcpSettings:
  allowedDomains:
    - "web_search_mcp"
    - "google_mcp"
mcpServers:
  web_search_mcp:
    type: streamable-http          # or: sse, stdio
    url: http://web_search_mcp:8080/mcp
    timeout: 60000
    initTimeout: 15000
    serverInstructions: true
    chatMenu: true
  google_mcp:
    type: streamable-http
    url: http://google_mcp:8081/mcp
    timeout: 60000
    initTimeout: 150000
    serverInstructions: true
    chatMenu: true
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
      token_url: 'https://oauth2.googleapis.com/token'
      client_id: '${GOOGLE_MCP_CLIENT_ID}'
      client_secret: '${GOOGLE_MCP_CLIENT_SECRET}'
      scope: 'https://www.googleapis.com/auth/gmail.readonly'
      redirect_uri: '${GOOGLE_MCP_REDIRECT_URI}'
      token_exchange_method: default_post
      token_endpoint_auth_methods_supported: ['client_secret_post']


modelSpecs:
  enforce: false
  prioritize: true
  addedEndpoints:
    - openAI
    - genie-agent
    - genie-agent-v2
  list:
    - name: "gpt-6.1-terra"
      label: "GPT 6.1 Terra"
      preset:
        endpoint: "openAI"
        model: "gpt-6.1-terra"
        useResponsesApi: true